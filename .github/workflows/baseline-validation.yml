name: Arm C baseline sensor verification
on:
  push:
  pull_request:
jobs:
  sensor-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Versioned baseline tooling tests
        run: python -m unittest discover -s baseline/tooling/tests -p 'test_*.py' -v
      - name: Local requirements gate controls
        run: python -m unittest discover -s tooling/tests -p 'test_*.py' -v
