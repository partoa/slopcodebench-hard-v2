name: Arm C tooling checks
on:
  push:
  pull_request:
jobs:
  requirements-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run requirement gate unit tests
        run: python -m unittest discover -s tooling/tests -p 'test_*.py' -v
